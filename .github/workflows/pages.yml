name: Publish Deep Learning for Computer Vision site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dlcv-notes-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/configure-pages@v5
      - name: Build the site (report existing broken links)
        run: uv run scripts/build_site.py --output _site --warn-only
      - name: Check rendering
        run: uv run scripts/check_render.py --warn-only
      - name: Crawl the built site
        run: uv run scripts/check_links.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
