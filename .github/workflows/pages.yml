name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Build wikilink index
        run: uv run --no-project python scripts/build_wikilink_index.py
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html _sidebar.md README.md .nojekyll wikilinks.json Knowledge-Map.md _site/
          for file in exam-*.md; do [ ! -f "$file" ] || cp "$file" _site/; done
          for dir in curriculum notes question-bank; do
            [ ! -d "$dir" ] || rsync -a --exclude='.venv' --exclude='__pycache__' --exclude='.pytest_cache' --exclude='cache' "$dir/" "_site/$dir/"
          done
          mkdir -p _site/sources/exam-papers
          if [ -d sources/exam-papers/assets ]; then rsync -a sources/exam-papers/assets/ _site/sources/exam-papers/assets/; fi
          find sources/exam-papers -maxdepth 1 -type f -name '*.md' -exec cp {} _site/sources/exam-papers/ \;
          for dir in 'month 1' 'month 2' 'month 3'; do
            [ ! -d "$dir" ] || rsync -a --exclude='.venv' --exclude='screenshots' --exclude='__pycache__' --exclude='.pytest_cache' --exclude='cache' "$dir/" "_site/$dir/"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
